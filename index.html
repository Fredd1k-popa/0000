<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Username Finder</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  :root {
    --bg: #0a0e1a;
    --card: rgba(255,255,255,0.035);
    --border: rgba(255,255,255,0.07);
    --text: #f1f5f9;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --accent: #3b82f6;
    --accent-2: #8b5cf6;
    --accent-glow: rgba(59,130,246,0.35);
    --green: #22c55e;
    --red: #ef4444;
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,0.18), transparent),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(139,92,246,0.12), transparent);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }

  svg { display: block; }

  /* ===== LOCK SCREEN ===== */
  #lockScreen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    gap: 22px;
    background: var(--bg);
    transition: opacity 0.4s, transform 0.4s;
  }
  #lockScreen.unlocked {
    opacity: 0;
    transform: scale(1.04);
    pointer-events: none;
  }
  .lock-icon {
    width: 72px; height: 72px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 48px -12px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);
    animation: float 3s ease-in-out infinite;
    color: #fff;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .lock-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-align: center;
  }
  .lock-subtitle {
    font-size: 13.5px;
    color: var(--muted-2);
    text-align: center;
    max-width: 280px;
    line-height: 1.5;
    margin-top: -12px;
  }
  .lock-form {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 8px;
  }
  .lock-input-wrap { position: relative; }
  .lock-input {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 15px;
    padding: 16px 50px 16px 18px;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    outline: none;
    transition: all 0.25s;
    letter-spacing: 2px;
  }
  .lock-input::placeholder {
    color: var(--muted);
    letter-spacing: normal;
    font-weight: 500;
  }
  .lock-input:focus {
    border-color: var(--accent);
    background: rgba(59,130,246,0.06);
    box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
  }
  .lock-input.error {
    border-color: var(--red);
    background: rgba(239,68,68,0.06);
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .eye-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--muted-2);
    cursor: pointer;
    padding: 10px;
    border-radius: 10px;
    transition: color 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .eye-btn:active { color: var(--text); }
  .lock-submit {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: none;
    border-radius: 15px;
    padding: 16px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 10px 30px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: all 0.2s;
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
  }
  .lock-submit:active { transform: scale(0.98); }
  .lock-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .lock-error {
    color: var(--red);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    min-height: 18px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .lock-error.show { opacity: 1; }

  /* ===== MAIN APP ===== */
  #app {
    position: relative;
    z-index: 1;
    display: none;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 18px);
    gap: 16px;
    max-width: 520px;
    margin: 0 auto;
    width: 100%;
  }
  #app.show { display: flex; }

  .header { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .logo {
    width: 44px; height: 44px;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);
    flex-shrink: 0;
    color: #fff;
  }
  .header-text h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.2; }
  .header-text p { font-size: 12px; color: var(--muted-2); margin-top: 2px; font-weight: 500; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode-btn {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    overflow: hidden;
  }
  .mode-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    opacity: 0;
    transition: opacity 0.25s;
  }
  .mode-btn > * { position: relative; z-index: 1; }
  .mode-btn .mode-icon {
    width: 26px; height: 26px;
    transition: transform 0.25s;
    color: var(--muted-2);
  }
  .mode-btn.active { border-color: transparent; box-shadow: 0 10px 30px -10px var(--accent-glow); }
  .mode-btn.active::before { opacity: 1; }
  .mode-btn.active .mode-icon { transform: scale(1.08); color: #fff; }
  .mode-btn:active { transform: scale(0.97); }

  .progress-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  .progress-card.show { display: flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .progress-head { display: flex; justify-content: space-between; align-items: center; }
  .progress-status { font-size: 13px; font-weight: 600; color: var(--muted-2); display: flex; align-items: center; gap: 7px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .progress-percent {
    font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .bar-track { height: 6px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }
  .bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .bar-fill::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 500; }
  .stats b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }

  .results {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column;
    gap: 8px; padding: 2px 0;
    -webkit-overflow-scrolling: touch;
  }
  .results::-webkit-scrollbar { width: 4px; }
  .results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  .empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; color: var(--muted); text-align: center; padding: 20px;
  }
  .empty-icon { color: var(--muted); opacity: 0.5; }
  .empty-text { font-size: 13.5px; font-weight: 500; max-width: 220px; line-height: 1.5; }

  .result-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 14px;
    display: flex; align-items: center;
    justify-content: space-between; gap: 10px;
    animation: slideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .result-left { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
  .result-avatar {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff;
    flex-shrink: 0;
    box-shadow: 0 4px 12px -3px var(--accent-glow);
  }
  .result-info { min-width: 0; flex: 1; }
  .result-name {
    font-size: 14.5px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .result-name::before { content: '@'; color: var(--muted); font-weight: 500; }
  .result-tag {
    font-size: 10.5px; color: var(--green); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-top: 2px; display: flex; align-items: center; gap: 4px;
  }
  .result-tag::before {
    content: ''; width: 5px; height: 5px;
    border-radius: 50%; background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }
  .take-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: none; border-radius: 10px;
    padding: 9px 16px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; text-decoration: none;
    white-space: nowrap; transition: all 0.2s;
    box-shadow: 0 4px 14px -4px var(--accent-glow);
    font-family: inherit; flex-shrink: 0;
  }
  .take-btn:active { transform: scale(0.94); }

  .cooldown {
    display: none; text-align: center;
    font-size: 13px; font-weight: 600; color: #fbbf24;
    padding: 12px;
    background: rgba(251,191,36,0.08);
    border: 1px solid rgba(251,191,36,0.18);
    border-radius: 14px;
    font-variant-numeric: tabular-nums;
  }
  .cooldown.show { display: block; }

  .start-btn {
    position: relative;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: none; border-radius: 16px;
    padding: 17px; font-size: 15.5px; font-weight: 700;
    cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: inherit;
    box-shadow: 0 10px 30px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);
    letter-spacing: -0.2px; overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
  }
  .start-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    opacity: 0; transition: opacity 0.3s;
  }
  .start-btn > * { position: relative; z-index: 1; }
  .start-btn:hover::before { opacity: 1; }
  .start-btn:active { transform: scale(0.98); }
  .start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .start-btn.loading .btn-icon,
  .start-btn.loading .btn-label { visibility: hidden; }
  .start-btn.loading::after {
    content: '';
    position: absolute; top: 50%; left: 50%;
    width: 20px; height: 20px;
    margin: -10px 0 0 -10px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    z-index: 2;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ===== LOCK SCREEN ===== -->
<div id="lockScreen">
  <div class="lock-icon">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </div>
  <div class="lock-title">Доступ ограничен</div>
  <div class="lock-subtitle">Введи пароль для доступа к подбору юзернеймов</div>

  <div class="lock-form">
    <div class="lock-input-wrap">
      <input
        type="password"
        class="lock-input"
        id="passwordInput"
        placeholder="Пароль"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >
      <button class="eye-btn" id="eyeBtn" type="button" aria-label="Показать пароль">
        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="lock-error" id="lockError"></div>
    <button class="lock-submit" id="unlockBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
      </svg>
      <span id="unlockLabel">Войти</span>
    </button>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app">
  <div class="header">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Username Finder</h1>
      <p>Поиск свободных 5-буквенных юзернеймов</p>
    </div>
  </div>

  <div class="modes">
    <button class="mode-btn active" data-mode="readable">
      <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7V5h16v2"/>
        <path d="M9 5v14"/>
        <path d="M15 5v14"/>
        <path d="M6 19h6"/>
      </svg>
      <span>Читаемые</span>
    </button>
    <button class="mode-btn" data-mode="random">
      <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/>
        <circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/>
        <circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/>
        <circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/>
      </svg>
      <span>Рандомные</span>
    </button>
  </div>

  <div class="progress-card" id="progressCard">
    <div class="progress-head">
      <div class="progress-status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Поиск...</span>
      </div>
      <div class="progress-percent" id="percentText">0%</div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="stats">
      <span>Найдено <b id="foundCount">0</b>/10</span>
      <span>Проверено <b id="checkedCount">0</b></span>
    </div>
  </div>

  <div class="results" id="results">
    <div class="empty" id="emptyState">
      <svg class="empty-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="6"/>
        <circle cx="12" cy="12" r="2"/>
      </svg>
      <div class="empty-text">Выбери режим и запусти поиск свободных юзернеймов</div>
    </div>
  </div>

  <div class="cooldown" id="cooldownText"></div>

  <button class="start-btn" id="startBtn">
    <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z"/>
    </svg>
    <span class="btn-label" id="startLabel">Запустить поиск</span>
  </button>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.('#0a0e1a');
  tg.setBackgroundColor?.('#0a0e1a');
}

const API_BASE = window.location.origin;
// const API_BASE = 'https://your-backend.example.com';

const state = {
  mode: 'readable',
  running: false,
  results: [],
  initData: tg?.initData || '',
  password: ''
};

const $ = id => document.getElementById(id);

async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ===== LOCK SCREEN =====
const passwordInput = $('passwordInput');
const unlockBtn = $('unlockBtn');
const unlockLabel = $('unlockLabel');
const lockError = $('lockError');
const eyeBtn = $('eyeBtn');
const eyeIcon = $('eyeIcon');

eyeBtn.addEventListener('click', () => {
  const isPass = passwordInput.type === 'password';
  passwordInput.type = isPass ? 'text' : 'password';
  eyeIcon.innerHTML = isPass
    ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
});

async function tryUnlock() {
  const pwd = passwordInput.value.trim();
  if (!pwd) {
    showLockError('Введи пароль');
    return;
  }

  unlockBtn.disabled = true;
  unlockLabel.textContent = 'Проверка...';

  try {
    const hash = await sha256(pwd);
    const expected = await sha256('linux');

    if (hash === expected) {
      state.password = pwd;
      lockError.classList.remove('show');
      passwordInput.classList.remove('error');
      $('lockScreen').classList.add('unlocked');
      setTimeout(() => {
        $('lockScreen').style.display = 'none';
        $('app').classList.add('show');
      }, 400);
      tg?.HapticFeedback?.notificationOccurred('success');
    } else {
      showLockError('Неверный пароль');
      passwordInput.classList.add('error');
      passwordInput.value = '';
      tg?.HapticFeedback?.notificationOccurred('error');
      setTimeout(() => passwordInput.classList.remove('error'), 500);
    }
  } catch (e) {
    showLockError('Ошибка проверки');
  } finally {
    unlockBtn.disabled = false;
    unlockLabel.textContent = 'Войти';
  }
}

function showLockError(msg) {
  lockError.textContent = msg;
  lockError.classList.add('show');
  setTimeout(() => lockError.classList.remove('show'), 2500);
}

unlockBtn.addEventListener('click', tryUnlock);
passwordInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') tryUnlock();
});
passwordInput.addEventListener('input', () => {
  lockError.classList.remove('show');
  passwordInput.classList.remove('error');
});

// ===== MAIN APP =====
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (state.running) return;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    tg?.HapticFeedback?.selectionChanged();
  });
});

function updateProgress(found, checked) {
  const pct = Math.min(100, Math.round((found / 10) * 100));
  $('barFill').style.width = pct + '%';
  $('percentText').textContent = pct + '%';
  $('foundCount').textContent = found;
  $('checkedCount').textContent = checked;
}

function addResult(username) {
  const el = document.createElement('div');
  el.className = 'result-item';
  el.innerHTML = `
    <div class="result-left">
      <div class="result-avatar">${username[0].toUpperCase()}</div>
      <div class="result-info">
        <div class="result-name">${username}</div>
        <div class="result-tag">свободен</div>
      </div>
    </div>
    <a class="take-btn" href="https://t.me/${username}" target="_blank" rel="noopener">Занять</a>
  `;
  $('results').appendChild(el);
  $('emptyState')?.remove();
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  tg?.HapticFeedback?.notificationOccurred('success');
}

$('startBtn').addEventListener('click', async () => {
  if (state.running) return;
  state.running = true;
  state.results = [];

  $('results').innerHTML = '';
  $('progressCard').classList.add('show');
  $('startBtn').disabled = true;
  $('startBtn').classList.add('loading');
  $('startLabel').textContent = 'Поиск...';
  $('statusText').textContent = 'Поиск...';
  $('statusDot').style.display = '';
  $('statusDot').style.background = '';
  $('statusDot').style.boxShadow = '';
  $('statusDot').style.animation = '';
  updateProgress(0, 0);

  try {
    const res = await fetch(API_BASE + '/api/find', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: state.mode,
        password: state.password,
        initData: state.initData
      })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n\n');
      buffer = lines.pop();

      for (const chunk of lines) {
        if (!chunk.startsWith('data: ')) continue;
        try { handleEvent(JSON.parse(chunk.slice(6))); } catch {}
      }
    }
  } catch (e) {
    $('statusText').textContent = 'Ошибка соединения';
    $('statusDot').style.background = '#ef4444';
  } finally {
    state.running = false;
    $('startBtn').disabled = false;
    $('startBtn').classList.remove('loading');
    $('startLabel').textContent = 'Запустить снова';
  }
});

function handleEvent(data) {
  if (data.type === 'progress') {
    updateProgress(data.found, data.checked);
  } else if (data.type === 'result') {
    state.results.push(data.username);
    addResult(data.username);
    updateProgress(state.results.length, data.checked);
  } else if (data.type === 'done') {
    updateProgress(state.results.length, data.checked);
    $('statusText').textContent = 'Готово';
    $('statusDot').style.background = '#22c55e';
    $('statusDot').style.boxShadow = '0 0 8px #22c55e';
    $('statusDot').style.animation = 'none';
    $('startLabel').textContent = 'Запустить снова';
  } else if (data.type === 'flood') {
    $('statusText').textContent = `FloodWait ${data.seconds}с`;
    $('statusDot').style.background = '#fbbf24';
  } else if (data.type === 'error') {
    $('statusText').textContent = data.message;
    $('statusDot').style.background = '#ef4444';
  } else if (data.type === 'cooldown') {
    showCooldown(data.seconds);
  } else if (data.type === 'auth_error') {
    $('lockScreen').classList.remove('unlocked');
    $('lockScreen').style.display = 'flex';
    $('app').classList.remove('show');
    showLockError('Сессия истекла, войди снова');
  }
}

let cooldownTimer = null;
function showCooldown(seconds) {
  const el = $('cooldownText');
  el.classList.add('show');
  $('startBtn').disabled = true;
  let left = seconds;
  const tick = () => {
    if (left <= 0) {
      clearInterval(cooldownTimer);
      el.classList.remove('show');
      $('startBtn').disabled = false;
      $('startLabel').textContent = 'Запустить поиск';
      return;
    }
    const m = Math.floor(left / 60);
    const s = left % 60;
    el.textContent = `Перезарядка ${m}:${String(s).padStart(2,'0')}`;
    left--;
  };
  tick();
  cooldownTimer = setInterval(tick, 1000);
}
</script>
